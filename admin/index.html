```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Doge vs Elon Musk — Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #fff;
}

.container {
    width: min(850px, 92%);
    margin: auto;
    padding: 50px 0;
}

h1 {
    font-size: clamp(40px, 8vw, 70px);
    line-height: .9;
    letter-spacing: -4px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 40px;
    font-weight: 700;
}

.panel {
    background: #fff;
    color: #111;
    border-radius: 25px;
    padding: 30px;
    border: 4px solid #fff;
}

.field {
    margin-bottom: 25px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 1000;
    text-transform: uppercase;
    margin-bottom: 8px;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-family: inherit;
    border: 3px solid #111;
    border-radius: 12px;
    outline: none;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #ff9f00;
}

button {
    width: 100%;
    padding: 17px;
    border: 3px solid #111;
    border-radius: 14px;
    background: #ffd43b;
    color: #111;
    font-size: 18px;
    font-weight: 1000;
    cursor: pointer;
}

button:hover {
    background: #ff9f00;
}

.upload-box {
    border: 3px dashed #111;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 15px;
}

.upload-box input {
    border: 0;
    padding: 0;
    margin-bottom: 15px;
}

.upload-button {
    background: #111;
    color: #fff;
    margin-top: 5px;
}

.upload-button:hover {
    background: #333;
}

.current-file {
    margin-top: 12px;
    padding: 12px;
    background: #eee;
    border-radius: 10px;
    font-size: 13px;
    word-break: break-all;
}

.status {
    margin-top: 18px;
    text-align: center;
    font-weight: 900;
}

.back {
    display: inline-block;
    margin-top: 25px;

}

</style>

</head>

<body>

<div class="container">

<h1>
ADMIN
</h1>

<div class="subtitle">
Doge vs Elon Musk — Site Control
</div>

<div class="panel">

<div class="field">

<label>
Main Title
</label>

<input
    id="title"
    type="text"
>

</div>

<div class="field">

<label>
Subtitle
</label>

<input
    id="subtitle"
    type="text"
>

</div>

<div class="field">

<label>
Price
</label>

<input
    id="price"
    type="text"
>

</div>

<div class="field">

<label>
Buy Button Text
</label>

<input
    id="buy_button"
    type="text"
>

</div>

<div class="field">

<label>
About
</label>

<textarea
    id="about"
></textarea>

</div>

<hr>

<h2>
Song
</h2>

<div class="upload-box">

<input
    id="songFile"
    type="file"
    accept=".mp3,audio/mpeg"
>

<button
    type="button"
    class="upload-button"
    onclick="uploadSong()"
>
    UPLOAD SONG
</button>

<div
    class="current-file"
    id="songCurrent"
>
    No song uploaded.
</div>

</div>

<hr>

<h2>
Hero Image
</h2>

<div class="upload-box">

<input
    id="imageFile"
    type="file"
    accept="image/jpeg,image/png,image/webp"
>

<button
    type="button"
    class="upload-button"
    onclick="uploadImage()"
>
    UPLOAD IMAGE
</button>

<div
    class="current-file"
    id="imageCurrent"
>
    No image uploaded.
</div>

</div>

<hr>

<button
    type="button"
    onclick="saveSettings()"
>
    SAVE CHANGES
</button>

<div
    class="status"
    id="status"
></div>

</div>

<a
    href="/"
    class="back"
>
    ← Back to website
</a>

</div>

<script>

const fields = [
    "title",
    "subtitle",
    "price",
    "buy_button",
    "about",
    "song_key",
    "image_key"
];


async function loadSettings() {

    try {

        const response =
            await fetch(
                "/admin-api",
                {
                    credentials: "include"
                }
            );

        if (!response.ok) {
            throw new Error(
                "Failed to load settings"
            );
        }

        const data =
            await response.json();

        for (const field of fields) {

            const element =
                document.getElementById(
                    field
                );

            if (element) {
                element.value =
                    data[field] || "";
            }

        }

        updateCurrentFiles(data);

    } catch (error) {

        setStatus(
            "Failed to load settings.",
            true
        );

        console.error(error);
    }
}


function updateCurrentFiles(data) {

    document.getElementById(
        "songCurrent"
    ).textContent =
        data.song_key
            ? `Current: ${data.song_key}`
            : "No song uploaded.";

    document.getElementById(
        "imageCurrent"
    ).textContent =
        data.image_key
            ? `Current: ${data.image_key}`
            : "No image uploaded.";
}


async function saveSettings() {

    const data = {};

    for (const field of fields) {

        data[field] =
            document.getElementById(
                field
            ).value;

    }

    setStatus("Saving...");

    try {

        const response =
            await fetch(
                "/admin-api",
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(data)
                }
            );

        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);
        }

        setStatus(
            "Saved successfully."
        );

    } catch (error) {

        setStatus(
            "Failed to save.",
            true
        );

        console.error(error);
    }
}


async function uploadSong() {

    const file =
        document.getElementById(
            "songFile"
        ).files[0];

    if (!file) {

        setStatus(
            "Select an MP3 file first.",
            true
        );

        return;
    }

    if (
        file.type !== "audio/mpeg" &&
        file.type !== "audio/mp3"
    ) {

        setStatus(
            "Only MP3 files are allowed.",
            true
        );

        return;
    }

    setStatus(
        "Uploading song..."
    );

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "type",
        "song"
    );

    try {

        const response =
            await fetch(
                "/admin-api",
                {
                    method: "POST",

                    credentials: "include",

                    body: formData
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Song upload failed"
            );
        }

        document.getElementById(
            "song_key"
        ).value =
            data.key;

        document.getElementById(
            "songCurrent"
        ).textContent =
            `Current: ${data.key}`;

        await saveSettings();

        document.getElementById(
            "songFile"
        ).value = "";

        setStatus(
            "Song uploaded successfully."
        );

    } catch (error) {

        setStatus(
            error.message,
            true
        );

        console.error(error);
    }
}


async function uploadImage() {

    const file =
        document.getElementById(
            "imageFile"
        ).files[0];

    if (!file) {

        setStatus(
            "Select an image first.",
            true
        );

        return;
    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        setStatus(
            "Only JPG, PNG and WebP images are allowed.",
            true
        );

        return;
    }

    setStatus(
        "Uploading image..."
    );

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "type",
        "image"
    );

    try {

        const response =
            await fetch(
                "/admin-api",
                {
                    method: "POST",

                    credentials: "include",

                    body: formData
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Image upload failed"
            );
        }

        document.getElementById(
            "image_key"
        ).value =
            data.key;

        document.getElementById(
            "imageCurrent"
        ).textContent =
            `Current: ${data.key}`;

        await saveSettings();

        document.getElementById(
            "imageFile"
        ).value = "";

        setStatus(
            "Image uploaded successfully."
        );

    } catch (error) {

        setStatus(
            error.message,
            true
        );

        console.error(error);
    }
}


function setStatus(
    message,
    error = false
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.style.color =
        error
            ? "#c00"
            : "#111";
}


loadSettings();

</script>

</body>

</html>
