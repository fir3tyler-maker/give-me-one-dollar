<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

<title>Doge vs Elon Musk — Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #fff;
}

.container {
    width: min(850px, 92%);
    margin: auto;

}

    font-size: clamp(40px, 8vw, 70px);
    line-height: .9;

}

    color: #aaa;

}

label {
    display: block;
    font-size: 12px;

textarea {
    width: 100%;
    padding: 14px;

    resize: vertical;
}

input:focus,

    width: 100%;

    background: #333;

<body>

<div class="container">

<h1>
ADMIN
</h1>

<div class="subtitle">
Doge vs Elon Musk — Site Control
</div>


<div class="panel">


<!-- SITE SETTINGS -->

<div class="field">

<label>
Main Title
</label>

<input
    id="title"
    type="text"
>

</div>


<div class="field">

<label>
Subtitle
</label>

<input
    id="subtitle"
    type="text"
>

</div>


<div class="field">

<label>
Price
</label>

<input
    id="price"
    type="text"
>

</div>


<div class="field">

<label>
Buy Button Text
</label>

<input
    id="buy_button"
    type="text"
>

</div>


<div class="field">

<label>
About
</label>

<textarea
    id="about"
></textarea>

</div>


<hr>


<!-- SONG -->

<h2>
Song
</h2>

<div class="upload-box">

<input
    id="songFile"
    type="file"
    accept=".mp3,audio/mpeg"
>

<button
    type="button"
    class="upload-button"
    onclick="uploadSong()"
>
    UPLOAD SONG
</button>

<div
    class="current-file"
    id="songCurrent"
>
    No song uploaded.
</div>

</div>


<hr>


<!-- IMAGE -->

<h2>
Hero Image
</h2>

<div class="upload-box">

<input
    id="imageFile"
    type="file"
    accept="image/jpeg,image/png,image/webp"
>

<button
    type="button"
    class="upload-button"
    onclick="uploadImage()"
>
    UPLOAD IMAGE
</button>

<div
    class="current-file"
    id="imageCurrent"
>
    No image uploaded.
</div>

</div>


<hr>


<!-- SAVE -->

<button
    type="button"
    onclick="saveSettings()"
>
    SAVE CHANGES
</button>


<div
    class="status"
    id="status"
></div>


</div>


<a
    href="/"
    class="back"
>
    ← Back to website
</a>


</div>


<script>


/* =========================
   CONFIGURATION
========================= */

const API_URL = "/admin-api";


const fields = [
    "title",
    "subtitle",
    "price",
    "buy_button",
    "about",
    "song_key",
    "image_key"
];


/* =========================
   HELPERS
========================= */

function getField(id) {

    return document.getElementById(id);

}


function setStatus(
    message,
    error = false
) {

    const status =
        getField("status");

    if (!status) {
        return;
    }

    status.textContent =
        message;

    status.style.color =
        error
            ? "#c00"
            : "#111";

    status.style.background =
        error
            ? "#ffe5e5"
            : "#eee";

}


/* =========================
   LOAD SETTINGS
========================= */

async function loadSettings() {

    setStatus(
        "Loading settings..."
    );

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const text =
            await response.text();


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}:\n${text}`
            );

        }


        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Server did not return valid JSON:\n" +
                text
            );

        }


        for (
            const field of fields
        ) {

            const element =
                getField(field);

            if (element) {

                element.value =
                    data[field] || "";

            }

        }


        updateCurrentFiles(data);


        setStatus(
            "Settings loaded."
        );

    } catch (error) {

        setStatus(
            error.message,
            true
        );

        console.error(
            "LOAD ERROR:",
            error
        );

    }

}


/* =========================
   CURRENT FILES
========================= */

function updateCurrentFiles(data) {

    const songCurrent =
        getField("songCurrent");

    const imageCurrent =
        getField("imageCurrent");


    if (songCurrent) {

        songCurrent.textContent =
            data.song_key
                ? `Current: ${data.song_key}`
                : "No song uploaded.";

    }


    if (imageCurrent) {

        imageCurrent.textContent =
            data.image_key
                ? `Current: ${data.image_key}`
                : "No image uploaded.";

    }

}


/* =========================
   SAVE SETTINGS
========================= */

async function saveSettings() {

    setStatus(
        "Saving..."
    );


    const data = {};


    for (
        const field of fields
    ) {

        const element =
            getField(field);

        if (element) {

            data[field] =
                element.value;

        }

    }


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(data)
                }
            );


        const text =
            await response.text();


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}:\n${text}`
            );

        }


        let result;

        try {

            result =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Server did not return valid JSON:\n" +
                text
            );

        }


        if (!result.success) {

            throw new Error(
                "Server did not confirm the save."
            );

        }


        setStatus(
            "Saved successfully."
        );


    } catch (error) {

        setStatus(
            "SAVE ERROR:\n" +
            error.message,
            true
        );

        console.error(
            "SAVE ERROR:",
            error
        );

    }

}


/* =========================
   UPLOAD SONG
========================= */

async function uploadSong() {

    const input =
        getField("songFile");


    if (!input) {

        setStatus(
            "ERROR: songFile input does not exist.",
            true
        );

        return;

    }


    const file =
        input.files[0];


    if (!file) {

        setStatus(
            "Select an MP3 file first.",
            true
        );

        return;

    }


    /*
       MP3 validation
    */

    const fileName =
        file.name.toLowerCase();


    if (
        !fileName.endsWith(".mp3")
    ) {

        setStatus(
            "Only .mp3 files are allowed.",
            true
        );

        return;

    }


    /*
       50 MB maximum
    */

    const maxSize =
        50 * 1024 * 1024;


    if (
        file.size > maxSize
    ) {

        setStatus(
            "The MP3 file is larger than 50 MB.",
            true
        );

        return;

    }


    setStatus(
        "Uploading song..."
    );


    try {

        const formData =
            new FormData();


        formData.append(
            "file",
            file,
            file.name
        );


        formData.append(
            "type",
            "song"
        );


        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    credentials: "include",

                    body: formData
                }
            );


        /*
           Read server response as TEXT first.
           This lets us see the real error.
        */

        const text =
            await response.text();


        console.log(
            "UPLOAD RESPONSE STATUS:",
            response.status
        );


        console.log(
            "UPLOAD RESPONSE:",
            text
        );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}:\n${text}`
            );

        }


        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Server did not return JSON:\n" +
                text
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Upload was not confirmed by server."
            );

        }


        /*
           Update database setting
        */

        const songKey =
            getField("song_key");


        if (songKey) {

            songKey.value =
                data.key;

        }


        /*
           Update visible status
        */

        const songCurrent =
            getField("songCurrent");


        if (songCurrent) {

            songCurrent.textContent =
                `Current: ${data.key}`;

        }


        /*
           Save song_key to D1
        */

        const saveResponse =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            song_key:
                                data.key
                        })
                }
            );


        const saveText =
            await saveResponse.text();


        if (!saveResponse.ok) {

            throw new Error(
                "File uploaded, but saving song setting failed:\n" +
                `Server returned ${saveResponse.status}:\n` +
                saveText
            );

        }


        input.value = "";


        setStatus(
            `Song uploaded successfully.\n${data.key}`
        );


    } catch (error) {

        setStatus(
            "SONG UPLOAD ERROR:\n" +
            error.message,
            true
        );


        console.error(
            "SONG UPLOAD ERROR:",
            error
        );

    }

}


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage() {

    const input =
        getField("imageFile");


    if (!input) {

        setStatus(
            "ERROR: imageFile input does not exist.",
            true
        );

        return;

    }


    const file =
        input.files[0];


    if (!file) {

        setStatus(
            "Select an image first.",
            true
        );

        return;

    }


    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        setStatus(
            "Only JPG, PNG and WebP images are allowed.",
            true
        );

        return;

    }


    const maxSize =
        50 * 1024 * 1024;


    if (
        file.size > maxSize
    ) {

        setStatus(
            "The image is larger than 50 MB.",
            true
        );

        return;

    }


    setStatus(
        "Uploading image..."
    );


    try {

        const formData =
            new FormData();


        formData.append(
            "file",
            file,
            file.name
        );


        formData.append(
            "type",
            "image"
        );


        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    credentials: "include",

                    body: formData
                }
            );


        const text =
            await response.text();


        console.log(
            "IMAGE UPLOAD STATUS:",
            response.status
        );


        console.log(
            "IMAGE UPLOAD RESPONSE:",
            text
        );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}:\n${text}`
            );

        }


        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Server did not return JSON:\n" +
                text
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Image upload was not confirmed by server."
            );

        }


        const imageKey =
            getField("image_key");


        if (imageKey) {

            imageKey.value =
                data.key;

        }


        const imageCurrent =
            getField("imageCurrent");


        if (imageCurrent) {

            imageCurrent.textContent =
                `Current: ${data.key}`;

        }


        /*
           Save image_key to D1
        */

        const saveResponse =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            image_key:
                                data.key
                        })
                }
            );


        const saveText =
            await saveResponse.text();


        if (!saveResponse.ok) {

            throw new Error(
                "Image uploaded, but saving image setting failed:\n" +
                `Server returned ${saveResponse.status}:\n` +
                saveText
            );

        }


        input.value = "";


        setStatus(
            `Image uploaded successfully.\n${data.key}`
        );


    } catch (error) {

        setStatus(
            "IMAGE UPLOAD ERROR:\n" +
            error.message,
            true
        );


        console.error(
            "IMAGE UPLOAD ERROR:",
            error
        );

    }

}


/* =========================
   START
========================= */

loadSettings();

</script>

</body>

</html>
