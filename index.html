<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Give Me One Dollar</title>

<meta
    name="description"
    content="Seven billion people give me one dollar. Let's beat Elon Musk."
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff6d5;
    color: #111;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.09;

    background-image:
        radial-gradient(#111 1px, transparent 1px);

    background-size: 24px 24px;

    z-index: -1;
}

.container {
    width: min(1150px, 92%);
    margin: auto;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 0;
}

.logo {
    font-size: 22px;
    font-weight: 1000;
    letter-spacing: -1px;
}

.nav-button {
    color: #111;
    background: white;
    text-decoration: none;

    border: 3px solid #111;
    border-radius: 999px;

    padding: 10px 17px;

    font-weight: 900;
}

.hero {
    text-align: center;
    padding: 45px 0 70px;
}

h1 {
    font-size: clamp(48px, 9vw, 105px);
    line-height: 0.88;
    letter-spacing: -6px;
    text-transform: uppercase;

    max-width: 1100px;
    margin: 20px auto;
}

.subheadline {
    font-size: clamp(21px, 3vw, 30px);
    font-weight: 800;

    margin: 25px auto 40px;

    max-width: 800px;
}

.main-card {
    max-width: 950px;

    margin: auto;

    background: #fffdf3;

    border: 4px solid #111;
    border-radius: 40px;

    padding: 40px 30px;

    box-shadow: 12px 12px 0 #111;
}

.doge {
    width: 310px;
    height: 310px;

    object-fit: cover;

    display: block;

    margin: 0 auto 35px;

    border-radius: 50%;

    border: 6px solid #111;

    box-shadow: 9px 9px 0 #111;

    animation: floatDoge 3s ease-in-out infinite;
}

@keyframes floatDoge {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}

.counter-label {
    font-size: 20px;
    font-weight: 900;

    text-transform: uppercase;

    color: #6d6555;
}

.counter {
    font-size: clamp(48px, 9vw, 92px);

    font-weight: 1000;

    letter-spacing: -6px;

    line-height: 1;

    margin: 8px 0;
}

.target {
    font-size: 20px;
    font-weight: 900;

    color: #6d6555;
}

.progress-box {
    height: 38px;

    background: #e5ddc4;

    border: 3px solid #111;

    border-radius: 999px;

    overflow: hidden;

    margin: 28px 0 15px;
}

.progress {
    height: 100%;
    width: 0%;

    background:
        linear-gradient(
            90deg,
            #ffd43b,
            #ff9f00
        );

    transition: width 0.5s ease;
}

.people {
    font-size: 18px;
    font-weight: 900;
}

.elon {
    margin-top: 35px;

    font-size: clamp(35px, 6vw, 65px);

    line-height: 0.95;

    font-weight: 1000;

    letter-spacing: -3px;

    text-transform: uppercase;
}

.elon span {
    display: block;

    background: #ffd43b;

    border: 3px solid #111;

    border-radius: 12px;

    padding: 8px 15px;

    width: fit-content;

    margin: 15px auto 0;

    transform: rotate(-2deg);
}

.give-button {
    display: inline-block;

    margin-top: 35px;

    padding: 19px 32px;

    background: #111;

    color: white;

    text-decoration: none;

    border-radius: 17px;

    font-size: 24px;

    font-weight: 1000;

    border: 3px solid #111;

    box-shadow: 7px 7px 0 #ff9f00;

    transition: 0.15s;
}

.give-button:hover {
    transform: translate(4px, 4px);

    box-shadow:
        3px 3px 0 #ff9f00;
}

.note {
    margin-top: 20px;

    font-size: 14px;

    color: #756d5c;

    font-weight: 700;
}

footer {
    border-top: 3px solid #111;

    margin-top: 40px;

    padding: 40px 0 60px;

    text-align: center;

    color: #756d5c;

    font-weight: 700;
}

@media (max-width: 700px) {

    h1 {
        letter-spacing: -3px;
    }

    .main-card {
        padding: 30px 17px;

        box-shadow:
            7px 7px 0 #111;
    }

    .doge {
        width: 220px;
        height: 220px;
    }

    .counter {
        letter-spacing: -3px;
    }

}

</style>
</head>

<body>

<div class="container">

    <nav>

        <div class="logo">
            🐕 GIVE ME $1
        </div>

        <a
            href="#give"
            class="nav-button"
        >
            GIVE ME $1
        </a>

    </nav>

    <section class="hero">

        <h1 id="headline">
            SEVEN BILLION PEOPLE GIVE ME ONE DOLLAR.
        </h1>

        <p
            class="subheadline"
            id="subheadline"
        >
            $1 × 7,000,000,000 = $7,000,000,000
        </p>

        <div class="main-card">

            <img
                class="doge"
                id="dogImage"
                src="/images/uploads/doge.jpg"
                alt="Doge"
            >

            <div class="counter-label">
                CURRENTLY RAISED
            </div>

            <div
                class="counter"
                id="amount"
            >
                $0
            </div>

            <div
                class="target"
                id="targetText"
            >
                TARGET: $7,000,000,000
            </div>

            <div class="progress-box">

                <div
                    class="progress"
                    id="progress"
                ></div>

            </div>

            <div
                class="people"
                id="people"
            >
                0 PEOPLE
            </div>

            <div class="elon">

                <span id="elonText">
                    LET'S BEAT ELON MUSK.
                </span>

            </div>

            <div id="give">

                <a
                    href="#"
                    class="give-button"
                    id="paymentButton"
                >
                    GIVE ME $1 →
                </a>

            </div>

            <div
                class="note"
                id="note"
            >
                One dollar. That's all.
            </div>

        </div>

    </section>

    <footer>

        <strong>
            GIVE ME ONE DOLLAR.
        </strong>

        <br><br>

        🐕 $1 → $7,000,000,000

        <br><br>

        <small>
            Doge image:
            Wikimedia Commons / CC0
        </small>

    </footer>

</div>

<script>

/*
====================================================
CMS CONTENT
====================================================

The editable content is stored in:

content/homepage.yml

Decap CMS edits that file.

Netlify then deploys the new version.
====================================================
*/

async function loadSiteContent() {

    try {

        const response = await fetch(
            "/content/homepage.yml",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "Could not load homepage content."
            );
        }

        const text = await response.text();

        const content = parseSimpleYaml(text);

        /*
         * HEADLINE
         */

        if (content.headline) {

            document.getElementById(
                "headline"
            ).textContent =
                content.headline;

        }

        /*
         * SUBHEADLINE
         */

        if (content.subheadline) {

            document.getElementById(
                "subheadline"
            ).textContent =
                content.subheadline;

        }

        /*
         * DOG IMAGE
         */

        if (content.dog_image) {

            document.getElementById(
                "dogImage"
            ).src =
                content.dog_image;

        }

        /*
         * TARGET
         */

        if (content.target) {

            const target =
                Number(content.target);

            if (
                Number.isFinite(target) &&
                target > 0
            ) {

                window.siteTarget =
                    target;

            }

        }

        /*
         * ELON TEXT
         */

        if (content.elon_text) {

            document.getElementById(
                "elonText"
            ).textContent =
                content.elon_text;

        }

        /*
         * BUTTON TEXT
         */

        if (content.button_text) {

            document.getElementById(
                "paymentButton"
            ).textContent =
                content.button_text;

        }

        /*
         * NOTE
         */

        if (content.note) {

            document.getElementById(
                "note"
            ).textContent =
                content.note;

        }

        updateCounter();

    } catch (error) {

        console.error(
            "CMS content error:",
            error
        );

    }

}


/*
====================================================
SIMPLE YAML READER
====================================================

Our homepage.yml contains simple
key/value fields, so we don't need
a large JavaScript framework.
====================================================
*/

function parseSimpleYaml(text) {

    const result = {};

    const lines =
        text.split(/\r?\n/);

    for (
        const line of lines
    ) {

        const trimmed =
            line.trim();

        if (
            !trimmed ||
            trimmed.startsWith("#")
        ) {
            continue;
        }

        const separator =
            trimmed.indexOf(":");

        if (
            separator === -1
        ) {
            continue;
        }

        const key =
            trimmed
                .slice(0, separator)
                .trim();

        let value =
            trimmed
                .slice(separator + 1)
                .trim();

        if (
            (
                value.startsWith('"') &&
                value.endsWith('"')
            ) ||
            (
                value.startsWith("'") &&
                value.endsWith("'")
            )
        ) {

            value =
                value.slice(1, -1);

        }

        result[key] =
            value;

    }

    return result;

}


/*
====================================================
STRIPE
====================================================
*/

const STRIPE_LINK =
    "https://buy.stripe.com/14A9AL1PScxdfUx8N6ao800";


document
    .getElementById("paymentButton")
    .addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            if (
                STRIPE_LINK === ""
            ) {

                alert(
                    "Payment is being connected. Please check back soon!"
                );

                return;

            }

            window.location.href =
                STRIPE_LINK;

        }
    );


/*
====================================================
LIVE COUNTER
====================================================
*/

let currentAmount = 0;
let currentPeople = 0;

window.siteTarget =
    7000000000;


async function loadCounter() {

    try {

        const response =
            await fetch(
                "/.netlify/functions/counter",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Counter request failed."
            );

        }

        const data =
            await response.json();

        currentAmount =
            Number(
                data.amount || 0
            );

        currentPeople =
            Number(
                data.people || 0
            );

        updateCounter();

    } catch (error) {

        console.error(
            "Counter error:",
            error
        );

    }

}


function updateCounter() {

    document.getElementById(
        "amount"
    ).textContent =
        "$" +
        currentAmount.toLocaleString(
            "en-US"
        );


    document.getElementById(
        "people"
    ).textContent =
        currentPeople.toLocaleString(
            "en-US"
        ) +
        " PEOPLE";


    const target =
        Number(
            window.siteTarget ||
            7000000000
        );


    const percentage =
        (
            currentAmount /
            target
        ) *
        100;


    document.getElementById(
        "progress"
    ).style.width =
        Math.min(
            Math.max(
                percentage,
                0
            ),
            100
        ) + "%";


    document.getElementById(
        "targetText"
    ).textContent =
        "TARGET: $" +
        target.toLocaleString(
            "en-US"
        );

}


/*
====================================================
START
====================================================
*/

loadSiteContent();

loadCounter();

setInterval(
    loadCounter,
    15000
);

</script>

</body>
</html>
