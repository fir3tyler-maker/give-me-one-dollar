```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Give Me One Dollar — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
    }

    .container {
      width: min(900px, calc(100% - 32px));
      margin: auto;
      padding: 40px 0;
    }

    .center {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    .muted {
      color: #aaa;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #0c0c0c;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: white;
      color: #111;
    }

    .secondary {
      background: #333;
      color: white;
    }

    .danger {
      background: #8b2222;
      color: white;
    }

    #admin {
      display: none;
    }

    #denied {
      display: none;
    }

    #loading {
      display: flex;
    }

    .status {
      margin-top: 15px;
      color: #8cff9a;
    }
  </style>
</head>

<body>

  <div id="loading" class="center">
    <div>
      <h1>Loading...</h1>
      <p class="muted">Checking authentication.</p>
    </div>
  </div>

  <div id="login" class="center" style="display:none;">
    <div class="card">
      <h1>🔐 Admin Panel</h1>
      <p class="muted">
        This area is restricted to the administrator.
      </p>

      <button class="primary" id="loginButton">
        Log in
      </button>
    </div>
  </div>

  <div id="denied" class="center">
    <div class="card">
      <h1>⛔ Access denied</h1>
      <p class="muted">
        Your account does not have the admin role.
      </p>

      <button class="secondary" id="logoutDenied">
        Log out
      </button>
    </div>
  </div>

  <div id="admin">

    <div class="container">

      <div class="card">
        <h1>Give Me One Dollar — Admin</h1>

        <p class="muted">
          You are logged in as the website administrator.
        </p>

        <button class="danger" id="logoutButton">
          Log out
        </button>
      </div>

      <div class="card">

        <h2>Website content</h2>

        <label for="title">Main title</label>

        <input
          id="title"
          value="Seven billion people give me one dollar"
        >

        <label for="headline">Main headline</label>

        <input
          id="headline"
          value="LET'S BEAT ELON MUSK"
        >

        <label for="button">Payment button</label>

        <input
          id="button"
          value="GIVE ME ONE DOLLAR"
        >

        <label for="description">Description</label>

        <textarea id="description">Seven billion people. One dollar each.</textarea>

        <label for="doge">Doge image URL</label>

        <input
          id="doge"
          type="url"
          placeholder="https://example.com/doge.jpg"
        >

        <br><br>

        <button class="primary" id="saveButton">
          Save Changes
        </button>

        <div id="status" class="status"></div>

      </div>

    </div>

  </div>


  <!-- Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <script type="module">

    import {
      getUser,
      login,
      logout,
      handleAuthCallback
    } from "https://cdn.jsdelivr.net/npm/@netlify/identity/+esm";


    const loading =
      document.getElementById("loading");

    const loginScreen =
      document.getElementById("login");

    const adminScreen =
      document.getElementById("admin");

    const deniedScreen =
      document.getElementById("denied");


    function showLogin() {

      loading.style.display = "none";
      loginScreen.style.display = "flex";
      adminScreen.style.display = "none";
      deniedScreen.style.display = "none";

    }


    function showAdmin() {

      loading.style.display = "none";
      loginScreen.style.display = "none";
      adminScreen.style.display = "block";
      deniedScreen.style.display = "none";

    }


    function showDenied() {

      loading.style.display = "none";
      loginScreen.style.display = "none";
      adminScreen.style.display = "none";
      deniedScreen.style.display = "flex";

    }


    function checkAdmin(user) {

      if (!user) {

        showLogin();
        return;

      }


      const roles =
        user.roles || [];


      if (roles.includes("admin")) {

        showAdmin();

      } else {

        showDenied();

      }

    }


    /*
     * IMPORTANT:
     *
     * This processes:
     * - invite_token
     * - confirmation_token
     * - recovery_token
     * - email_change_token
     *
     * sent by Netlify in the URL hash.
     */

    try {

      const callback =
        await handleAuthCallback();


      if (callback && callback.user) {

        checkAdmin(callback.user);

      } else {

        const user =
          await getUser();

        checkAdmin(user);

      }

    } catch (error) {

      console.error(
        "Authentication callback error:",
        error
      );

      showLogin();

    }


    document
      .getElementById("loginButton")
      .addEventListener("click", async () => {

        try {

          await login();

        } catch (error) {

          console.error(error);

          alert(
            "Login failed. Please try again."
          );

        }

      });


    document
      .getElementById("logoutButton")
      .addEventListener("click", async () => {

        await logout();

        showLogin();

      });


    document
      .getElementById("logoutDenied")
      .addEventListener("click", async () => {

        await logout();

        showLogin();

      });


    document
      .getElementById("saveButton")
      .addEventListener("click", () => {

        const settings = {

          title:
            document.getElementById("title").value,

          headline:
            document.getElementById("headline").value,

          button:
            document.getElementById("button").value,

          description:
            document.getElementById("description").value,

          doge:
            document.getElementById("doge").value

        };


        localStorage.setItem(
          "siteSettings",
          JSON.stringify(settings)
        );


        document.getElementById(
          "status"
        ).textContent =
          "Saved locally. Next step: connect this to the live website.";

      });

  </script>

</body>
</html>
```
